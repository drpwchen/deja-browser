# edge-recipes config — copy to:
#   Windows  %APPDATA%\edge-recipes\config.toml
#   macOS    ~/Library/Application Support/edge-recipes/config.toml
#   Linux    ~/.config/edge-recipes/config.toml
# (or point EDGE_RECIPES_CONFIG at it). Every key is optional; ~ and $VARS are expanded.

[browser]
# executable = "C:/Program Files/Google/Chrome/Application/chrome.exe"   # default: first of Edge/Chrome/Chromium/Brave
# profile = "~/.edge-recipes-profile"     # dedicated user-data-dir; default <data dir>/profile
# sessions_file = "~/.edge-recipes-sessions.json"
# port = 9222                             # CDP, always bound to 127.0.0.1

[recipes]
# dir = "~/edge-recipes"                  # default <data dir>/recipes
# deny_hosts_extra = ["mybank", "mybroker"]   # added to the built-in mail/bank/broker refusals
# allow_ticket_hosts = []                 # ticketing / rail booking hosts are refused by default
#                                         # (anti-scalping laws). Lift one ("railway.gov.tw") or all
#                                         # ("*") at your own risk — not recommended.

[captcha]
# hcaptcha_solver = "off"                 # "gemini" = solve hCaptcha image/drag challenges with
#                                         # Google Gemini. Sends the cropped challenge image to Google.
#                                         # Needs hcaptcha-challenger (GPL-3.0, install it yourself):
#                                         # pip install "hcaptcha-challenger @ git+https://github.com/QIN2DIM/hcaptcha-challenger@28ee79b"
# gemini_model = "gemini-3.7-flash"
# gemini_key_secret = "GEMINI_API_KEY"    # secret NAME, read through [secrets]
# solver_timeout = 180                    # seconds per challenge

[secrets]
# backend = "keyring"                     # keyring (default) | env | python
# service = "edge-recipes"                # keyring service name
# env_prefix = "EDGE_RECIPES_SECRET_"     # backend = "env"
# python = "~/my_store.py:get_secret"     # backend = "python": function(name) -> str | None
# set_hint = "keyring set edge-recipes {name}"   # shown when a secret is missing

[notify]
# ntfy = "https://ntfy.sh/your-private-topic"
# command = ["notify-send", "{title}", "{message}"]   # {python} = current interpreter
