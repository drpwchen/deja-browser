[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deja-browser"
version = "0.1.4"
description = "The agent browser that remembers: a separate Chromium profile your AI agent drives over CDP, with site recipes so the second visit skips reading the page."
readme = "README.md"
keywords = ["browser-automation", "cdp", "ai-agent", "claude-code", "playwright", "captcha"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45"]

[project.urls]
Homepage = "https://github.com/drpwchen/deja-browser"
Changelog = "https://github.com/drpwchen/deja-browser/blob/main/CHANGELOG.md"
Issues = "https://github.com/drpwchen/deja-browser/issues"

[project.optional-dependencies]
stealth = ["patchright"]          # default driver when installed (hides Runtime.enable)
keyring = ["keyring"]             # default secret backend
audio = ["faster-whisper", "av<19"]   # reCAPTCHA audio; faster-whisper 1.2.1 passes av.open(metadata_errors=), removed in av 19
ocr = ["ddddocr"]                 # text-image CAPTCHAs
# hCaptcha (GPL-3.0, optional, installed by the user). PyPI 0.19.0 fails the drag challenges;
# the tested build is git 28ee79b. Not installable from PyPI as an extra until upstream releases.
# pip install "hcaptcha-challenger @ git+https://github.com/QIN2DIM/hcaptcha-challenger@28ee79b"
dev = ["pytest"]

[project.scripts]
deja-browser = "deja_browser.recipe:main"
deja-cdp = "deja_browser.browser:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
